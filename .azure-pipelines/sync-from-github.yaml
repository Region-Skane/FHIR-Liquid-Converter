# .azure-pipelines/sync-from-github.yaml
# Sync this Azure DevOps repo from GitHub upstream on a schedule.

trigger: none
pr: none

schedules:
  - cron: "0 4 * * *"
    displayName: "Sync from GitHub"
    always: true
    branches:
      include:
        - public/main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: true
    fetchDepth: 0

  - script: |
      set -euo pipefail

      echo "========== Sync: start =========="
      date -u
      echo ""

      echo "==> Configure git identity"
      git config user.email "automation-pipeline@skane.se"
      git config user.name "Automation Pipeline"
      git config --list | grep -E '^user\.(name|email)=' || true
      echo ""

      echo "==> Remotes"
      git remote -v || true
      echo ""

      echo "==> Checkout target branch: public/main"
      git checkout public/main
      echo "HEAD: $(git rev-parse --short HEAD)  |  $(git log -1 --pretty=format:%s)"
      echo ""

      echo "==> Update from origin/public/main"
      git fetch origin public/main
      git reset --hard origin/public/main
      echo "After reset -> HEAD: $(git rev-parse --short HEAD)  |  $(git log -1 --pretty=format:%s)"
      echo ""

      echo "==> Ensure upstream remote exists"
      git remote get-url upstream >/dev/null 2>&1 || \
        git remote add upstream https://github.com/Region-Skane/FHIR-Liquid-Converter.git
      echo "upstream: $(git remote get-url upstream)"
      echo ""

      echo "==> Fetch upstream/public/main"
      git fetch upstream public/main
      echo "upstream/public/main: $(git rev-parse --short upstream/public/main)"
      echo ""

      echo "==> Fast-forward merge from upstream/public/main"
      git merge --ff-only upstream/public/main
      echo "After merge -> HEAD: $(git rev-parse --short HEAD)  |  $(git log -1 --pretty=format:%s)"
      echo ""

      echo "==> Push to origin public/main"
      git push origin public/main
      echo ""

      echo "========== Sync: done =========="
    displayName: "Sync origin/public/main from upstream/public/main"

# .azure-pipelines/sync-from-github.yaml
# Sync this Azure DevOps repo from GitHub upstream on a schedule.

trigger: none
pr: none

schedules:
  - cron: "0 3 * * *"
    displayName: "Sync from GitHub"
    always: true
    branches:
      include:
        - public/main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: true
    fetchDepth: 0

  - script: |
      set -euo pipefail

      git config user.email "automation-pipeline@skane.se"
      git config user.name "Automation Pipeline"

      # Ensure we're actually on the branch we intend to update
      git checkout public/main

      # Make sure we are based on latest origin/public/main (prevents push rejection & weird states)
      git fetch origin public/main
      git reset --hard origin/public/main

      # Add upstream (idempotent)
      git remote get-url upstream >/dev/null 2>&1 || \
        git remote add upstream https://github.com/Region-Skane/FHIR-Liquid-Converter.git

      # Fetch upstream and fast-forward
      git fetch upstream public/main
      git merge --ff-only upstream/public/main

      # Push back
      git push origin public/main
    displayName: "Sync origin/public/main from upstream/public/main"
